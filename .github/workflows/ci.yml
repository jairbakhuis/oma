name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real type check across src/ (tsconfig.json, noEmit).
      - name: Typecheck
        run: npm run typecheck

      # Real unit tests (node:test via tsx). No network, no credentials.
      - name: Tests
        run: npm test

      # NOTE: `npm run check` is deliberately NOT run here. It is a live smoke
      # test that talks to the Letta cloud agent and needs OMA_LETTA_API_KEY and
      # the agent id, so it cannot run on a public runner. It stays a manual
      # check on the machine that actually hosts the bot.
